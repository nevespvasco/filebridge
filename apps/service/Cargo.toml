[package]
name = "filebridge-service"
description = "filebridge background service: hosts the engine and serves ipc over a local socket"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "filebridge-service"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["env"] }
filebridge-core.workspace = true
filebridge-host.workspace = true
filebridge-ipc.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

# The per-user Run key that starts the engine at login (src/run_key.rs).
[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[dev-dependencies]
filebridge-host.workspace = true
filebridge-transport-api.workspace = true
tempfile.workspace = true
