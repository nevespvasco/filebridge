[package]
name = "filebridge-cli"
description = "filebridge command line: the engine without a UI (servers, scripts)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "filebridge"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["env"] }
filebridge-core.workspace = true
filebridge-host.workspace = true
filebridge-integration-nextcloud.workspace = true
filebridge-ipc.workspace = true
filebridge-names.workspace = true
filebridge-scanner.workspace = true
filebridge-store.workspace = true
filebridge-transport-api.workspace = true
filebridge-transport-rclone.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "signal"] }
tracing-subscriber.workspace = true
