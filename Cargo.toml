[workspace]
resolver = "2"
members = [
    "apps/cli",
    "apps/desktop/src-tauri",
    "apps/service",
    "crates/core",
    "crates/host",
    "crates/integration-api",
    "crates/integration-immich",
    "crates/integration-nextcloud",
    "crates/ipc",
    "crates/model",
    "crates/names",
    "crates/scanner",
    "crates/secrets",
    "crates/store",
    "crates/thumbnail",
    "crates/transport-api",
    "crates/transport-fake",
    "crates/transport-nextcloud",
    "crates/transport-rclone",
]

[workspace.package]
version = "0.4.1"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
# Internal crates
filebridge-core = { path = "crates/core" }
filebridge-host = { path = "crates/host" }
filebridge-integration-api = { path = "crates/integration-api" }
filebridge-integration-immich = { path = "crates/integration-immich" }
filebridge-integration-nextcloud = { path = "crates/integration-nextcloud" }
filebridge-ipc = { path = "crates/ipc" }
filebridge-model = { path = "crates/model" }
filebridge-names = { path = "crates/names" }
filebridge-secrets = { path = "crates/secrets" }
filebridge-scanner = { path = "crates/scanner" }
filebridge-store = { path = "crates/store" }
filebridge-thumbnail = { path = "crates/thumbnail" }
filebridge-transport-api = { path = "crates/transport-api" }
filebridge-transport-fake = { path = "crates/transport-fake" }
filebridge-transport-nextcloud = { path = "crates/transport-nextcloud" }
filebridge-transport-rclone = { path = "crates/transport-rclone" }

# External
anyhow = "1"
async-trait = "0.1"
bitflags = { version = "2", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
getrandom = "0.3"
interprocess = { version = "2", features = ["tokio"] }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
rusqlite = { version = "0.40", features = ["bundled"] }
russh = "0.64"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# specta and specta-typescript are pinned to what tauri-specta 2.0.0-rc.26 requires.
specta = "=2.0.0-rc.26"
specta-typescript = "=0.0.13"
tempfile = "3"
thiserror = "2"
tokio = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
# Parses server addresses the user types (Nextcloud WebDAV mode, Immich).
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
zeroize = "1"
