[package]
name = "filebridge-transport-rclone"
description = "Transport implementation over rclone's rc API"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# rclone linked into the process (`Librclone`), for phones (ADR 0014).
librclone = ["dep:libloading"]
# librclone linked in as a static archive, for iOS: build.rs links `sidecars/librclone/build.sh`'s
# output for the target (or `LIBRCLONE_LIB_DIR`).
librclone-linked = ["librclone"]

[dependencies]
async-trait.workspace = true
chrono.workspace = true
filebridge-names.workspace = true
filebridge-transport-api.workspace = true
getrandom.workspace = true
libloading = { version = "0.8", optional = true }
reqwest.workspace = true
russh.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "process", "rt", "sync", "time"] }
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[dev-dependencies]
filebridge-secrets.workspace = true
filebridge-transport-api = { workspace = true, features = ["contract"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
