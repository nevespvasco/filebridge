[package]
name = "filebridge-secrets"
description = "Secrets in the OS keyring (ADR 0004): app passwords and SSH keys of profiles"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
filebridge-transport-api.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
zeroize.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time"] }

# Keychain on macOS, Credential Manager on Windows, Secret Service on Linux (GNOME Keyring,
# KWallet), synchronously: calls are wrapped in `spawn_blocking` by their callers.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }
