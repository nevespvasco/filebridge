[package]
name = "filebridge-thumbnail"
description = "Small previews of source images, made read-only and kept in a bounded cache"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Pure Rust decoders only (no rayon, no C libraries), so phones build the same code.
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
sha2.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
