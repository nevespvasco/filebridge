[package]
name = "filebridge-host"
description = "Wiring shared by the binaries that host the engine: data dir, lock, rclone sidecar, built-in plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# rclone loaded into the process (`TransportChoice::Librclone`), for phones (ADR 0014).
librclone = ["filebridge-transport-rclone/librclone"]
# librclone linked into the program (iOS) instead of loaded from a file.
librclone-linked = ["librclone", "filebridge-transport-rclone/librclone-linked"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64 = "0.22"
notify = "8.2"
filebridge-core.workspace = true
filebridge-integration-api.workspace = true
filebridge-integration-immich.workspace = true
filebridge-integration-nextcloud.workspace = true
filebridge-ipc.workspace = true
filebridge-secrets.workspace = true
filebridge-thumbnail.workspace = true
filebridge-transport-api.workspace = true
filebridge-transport-fake.workspace = true
filebridge-transport-nextcloud.workspace = true
filebridge-transport-rclone.workspace = true
russh.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "rt"] }
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
filebridge-integration-immich = { workspace = true, features = ["fake"] }
interprocess.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "time"] }
