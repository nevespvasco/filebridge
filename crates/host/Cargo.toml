[package]
name = "filebridge-host"
description = "Wiring shared by the binaries that host the engine: data dir, lock, rclone sidecar, built-in plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
filebridge-core.workspace = true
filebridge-integration-api.workspace = true
filebridge-integration-nextcloud.workspace = true
filebridge-ipc.workspace = true
filebridge-secrets.workspace = true
filebridge-transport-api.workspace = true
filebridge-transport-fake.workspace = true
filebridge-transport-rclone.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true

[dev-dependencies]
interprocess.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "time"] }
