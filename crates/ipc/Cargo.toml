[package]
name = "filebridge-ipc"
description = "Window/CLI to service IPC: request, response and event types"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
filebridge-model.workspace = true
filebridge-transport-api.workspace = true
interprocess.workspace = true
serde.workspace = true
serde_json.workspace = true
specta = { workspace = true, features = ["derive", "serde_json"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "io-util", "macros", "time", "fs"] }
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
widestring = "1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }
