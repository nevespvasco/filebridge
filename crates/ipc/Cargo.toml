[package]
name = "filebridge-ipc"
description = "Window/CLI to service IPC: request, response and event types"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
filebridge-core.workspace = true
filebridge-transport-api.workspace = true
interprocess.workspace = true
serde.workspace = true
serde_json.workspace = true
specta = { workspace = true, features = ["derive", "serde_json"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "io-util", "macros", "time", "fs"] }
tracing.workspace = true

[dev-dependencies]
filebridge-integration-api.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
