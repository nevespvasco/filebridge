[package]
name = "filebridge-transport-nextcloud"
description = "Transport adapter that sends small files to Nextcloud through its bulk upload, over another Transport"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
filebridge-names.workspace = true
filebridge-transport-api.workspace = true
getrandom.workspace = true
md5 = "0.8"
reqwest = { workspace = true, features = ["rustls-tls-native-roots", "rustls-tls-webpki-roots"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "sync", "time", "rt"] }
tracing.workspace = true

[dev-dependencies]
filebridge-secrets.workspace = true
filebridge-transport-api = { workspace = true, features = ["contract"] }
filebridge-transport-rclone.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
